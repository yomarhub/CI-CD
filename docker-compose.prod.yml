name: CI/CD prod
services:
  db:
    environment:
      POSTGRES_DB: shoplite_prod
      POSTGRES_USER: shoplite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    networks:
      - shoplite_prod

  api:
    environment:
      NODE_ENV: production
      LOG_LEVEL: warn
      DATABASE_URL: postgres://shoplite:${POSTGRES_PASSWORD}@db:5432/shoplite_prod
    restart: unless-stopped
    networks:
      - shoplite_prod

  frontend:
    restart: unless-stopped
    networks:
      - shoplite_prod

  proxy:
    ports:
      - "${HTTP_PORT:-80}:80"
    restart: unless-stopped
    networks:
      - shoplite_prod

networks:
  shoplite_prod:
    driver: bridge