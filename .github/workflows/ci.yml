name: CI starter a completer

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # Lancer tests, lint et build
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Set workdir
        run: cd api

      - name: Install dependencies
        run: npm install

      # Run tests
      - name: Run tests
        run: npm test

      # Run lint
      - name: Run lint
        run: npm run lint

  docker-build-check:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: test-lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t trainshop-api:test ./api

      - name: Build frontend image
        run: docker build -t trainshop-frontend:test ./frontend
