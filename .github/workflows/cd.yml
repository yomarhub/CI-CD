name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.yml
  COMPOSE_STAGING: docker-compose.staging.yml
  COMPOSE_PROD: docker-compose.prod.yml
  COMPOSE_PROJECT: shoplite

permissions:
  contents: write

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build images
        run: |
          APP_VERSION=${{ steps.tag.outputs.tag }} \
            docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE build --no-cache

      - name: Export images
        run: |
          docker save $COMPOSE_PROJECT-api $COMPOSE_PROJECT-frontend \
            | gzip > images.tar.gz

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: images.tar.gz
          retention-days: 1

  staging:
    name: Deploy -> staging
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: docker load < images.tar.gz

      - name: Start staging stack
        run: |
          docker compose -p $COMPOSE_PROJECT \
            -f $COMPOSE_FILE \
            -f $COMPOSE_STAGING \
            up -d --wait
        env:
          APP_VERSION: staging-${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'staging_password' }}

      - name: Run smoke tests
        run: |
          chmod +x scripts/smoke-test.sh
          BASE_URL=http://localhost:8081 bash scripts/smoke-test.sh

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose -p $COMPOSE_PROJECT \
            -f $COMPOSE_FILE \
            -f $COMPOSE_STAGING \
            logs --no-color

      - name: Teardown staging
        if: always()
        run: |
          docker compose -p $COMPOSE_PROJECT \
            -f $COMPOSE_FILE \
            -f $COMPOSE_STAGING \
            down -v

  production:
    name: Deploy -> production
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download images
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load images
        run: docker load < images.tar.gz

      - name: Deploy production stack
        run: |
          docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE -f $COMPOSE_PROD up -d --wait
        env:
          APP_VERSION: ${{ github.sha }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'prod_password' }}

      - name: Run smoke tests (production)
        run: |
          chmod +x scripts/smoke-test.sh
          BASE_URL=http://localhost bash scripts/smoke-test.sh

      - name: Tag stable release
        if: success()
        run: |
          git tag -f stable
          git push origin stable --force

  rollback:
    name: Rollback production
    runs-on: ubuntu-latest
    needs: production
    if: failure()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch stable tag
        run: git fetch --tags

      - name: Checkout stable
        run: git checkout stable

      - name: Rebuild stable images
        run: docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE -f $COMPOSE_PROD build --no-cache

      - name: Redeploy stable
        run: docker compose -p $COMPOSE_PROJECT -f $COMPOSE_FILE -f $COMPOSE_PROD up -d --wait

      - name: Verify rollback
        run: |
          chmod +x scripts/smoke-test.sh
          BASE_URL=http://localhost bash scripts/smoke-test.sh

      - name: Notify rollback
        run: |
          echo "::warning ::Production deployment failed — rolled back to tag 'stable'"
